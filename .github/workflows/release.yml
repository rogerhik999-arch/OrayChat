# OrayChat 全平台发布工作流
# 触发：推送 v* 标签（如 v1.0.0）→ 构建五平台安装包 → 上传到 GitHub Release
# 本地构建：见 README（macOS 可直接本地出全部桌面产物）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: 'release/*.dmg' }
      - uses: actions/upload-artifact@v4
        with: { name: macos-zip, path: 'release/*.zip' }

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'release/*.exe' }

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb --x64
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 'release/*.AppImage' }
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: 'release/*.deb' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: node scripts/build-www.mjs
      - run: npx cap sync android
      - run: node scripts/sync-version.mjs
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/build-www.mjs
      - run: npx cap sync ios
      - run: node scripts/sync-version.mjs
      # 无签名模拟器构建（真机分发需 Apple 开发者账号签名）
      - run: |
          cd ios/App
          pod install || echo "pod install skipped (SPM)"
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/OrayChat-ios-simulator.zip" OrayChat.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator, path: 'OrayChat-ios-simulator.zip' }

  release:
    needs: [desktop-mac, desktop-windows, desktop-linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
