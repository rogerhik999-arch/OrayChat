# OrayChat 全平台发布工作流
# 触发：推送 v* 标签（如 v1.0.0）→ 构建五平台安装包 → 上传到 GitHub Release
# 本地构建：见 README（macOS 可直接本地出全部桌面产物）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Bundle cloudflared (darwin-arm64)
        run: |
          mkdir -p build/cloudflared
          curl -sSL --retry 5 -o /tmp/cfd.tgz https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cfd.tgz -C build/cloudflared
          echo "5472c1a01c84bc31b3021056a73b4e5774ddddefc572124ea8fdf6c340639f32  build/cloudflared/cloudflared" | shasum -a 256 -c -
          chmod +x build/cloudflared/cloudflared
      - run: npx electron-builder --mac --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: 'release/*.dmg' }
      - uses: actions/upload-artifact@v4
        with: { name: macos-zip, path: 'release/*.zip' }

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Bundle cloudflared (windows-amd64)
        run: |
          New-Item -ItemType Directory -Force -Path build/cloudflared | Out-Null
          curl.exe -sSL --retry 5 -o build/cloudflared/cloudflared.exe https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-windows-amd64.exe
          $size = (Get-Item build/cloudflared/cloudflared.exe).Length
          if ($size -lt 40000000) { Write-Host "downloaded size=$size"; exit 1 }
          $h = (Get-FileHash build/cloudflared/cloudflared.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne 'f096265ec2fcbe9bb6e2d64268db167ced3fcbb83d894bdb9e2fcdb26f2ea7e2') { Write-Host "sha mismatch: $h"; exit 1 }
      - run: npx electron-builder --win --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'release/*.exe' }

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Bundle cloudflared (linux-amd64)
        run: |
          mkdir -p build/cloudflared
          curl -sSL --retry 5 -o build/cloudflared/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  build/cloudflared/cloudflared" | sha256sum -c -
          chmod +x build/cloudflared/cloudflared
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 'release/*.AppImage' }
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: 'release/*.deb' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-www.mjs
      - run: npx cap sync android
      # cap sync 会重新生成 capacitor-cordova-android-plugins（含其仓库配置）。
      # CI 在海外网络：把阿里云镜像替换为官方源，避免镜像 5xx 导致构建失败
      - name: Point gradle repos at official sources (CI)
        run: |
          find android -name build.gradle -exec sed -i             -e 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g'             -e 's|https://maven.aliyun.com/repository/google|https://maven.googleapis.com|g'             -e 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' {} +
      - run: node scripts/sync-version.mjs
      # 从仓库 Secrets 解码发布密钥库（未配置时产出 unsigned 包）
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/oraychat-release.keystore
            printf 'storeFile=oraychat-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
          else
            echo "未配置签名 Secrets，release 包将不含签名"
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-www.mjs
      - run: npx cap sync ios
      - run: node scripts/sync-version.mjs
      # 无签名模拟器构建（真机分发需 Apple 开发者账号签名）
      - run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          fi
          cd build/Build/Products/Debug-iphonesimulator
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -1)
          zip -r "$GITHUB_WORKSPACE/OrayChat-ios-simulator.zip" "$APP_PATH"
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator, path: 'OrayChat-ios-simulator.zip' }

  release:
    needs: [desktop-mac, desktop-windows, desktop-linux, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: artifacts }
      # 分布式自动更新：签名清单（Secret 缺失时跳过，不阻断发版）
      - name: Sign update manifest
        env:
          ORAY_UPDATE_SIGN_KEY: ${{ secrets.ORAY_UPDATE_SIGN_KEY }}
        run: node tools/sign-update-manifest.mjs artifacts "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          overwrite_files: true
          generate_release_notes: true
          files: |
            artifacts/manifest.json
            artifacts/manifest.sig
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
            artifacts/**/*.zip
