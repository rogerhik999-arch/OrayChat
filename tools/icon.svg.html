<!doctype html>
<!-- OrayChat 产品图标渲染页（--render-icon 构建管线专用，1024×1024 透明背景） -->
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2634"/>
      <stop offset="1" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63a0ff"/>
      <stop offset="1" stop-color="#2f6ae0"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0c0"/>
      <stop offset="1" stop-color="#3a9f8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>

  <!-- 对端小气泡（青绿，P2P 的另一方），右上角 -->
  <g>
    <path d="M 610 176 h 210 a 96 96 0 0 1 96 96 v 88 a 96 96 0 0 1 -96 96 h -150 l -84 78 l 6 -78 h 18 a 96 96 0 0 1 -96 -96 v -88 a 96 96 0 0 1 96 -96 z" fill="none" stroke="#54c8ae" stroke-width="18" stroke-opacity="0.9"/>
    <circle cx="700" cy="264" r="16" fill="#54c8ae"/>
    <circle cx="760" cy="264" r="16" fill="#54c8ae" fill-opacity="0.75"/>
    <circle cx="820" cy="264" r="16" fill="#54c8ae" fill-opacity="0.5"/>
  </g>

  <!-- 主气泡（蓝色渐变） -->
  <g>
    <path d="M 372 330 h 376 a 132 132 0 0 1 132 132 v 216 a 132 132 0 0 1 -132 132 h -406 l -152 132 l 34 -132 h -14 a 132 132 0 0 1 -132 -132 v -216 a 132 132 0 0 1 132 -132 z" fill="url(#bubble)"/>
    <path d="M 372 330 h 376 a 132 132 0 0 1 132 132 v 216 a 132 132 0 0 1 -132 132 h -406 l -152 132 l 34 -132 h -14 a 132 132 0 0 1 -132 -132 v -216 a 132 132 0 0 1 132 -132 z" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>
  </g>

  <!-- 锁（白色，端到端加密） -->
  <g>
    <!-- 锁环 -->
    <path d="M 448 520 v -56 a 96 96 0 0 1 192 0 v 56" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round"/>
    <!-- 锁体 -->
    <rect x="396" y="508" width="296" height="212" rx="44" fill="#ffffff"/>
    <rect x="396" y="508" width="296" height="212" rx="44" fill="none" stroke="#2f6ae0" stroke-opacity="0.25" stroke-width="4"/>
    <!-- 锁孔 -->
    <circle cx="544" cy="592" r="30" fill="#2f6ae0"/>
    <rect x="530" y="600" width="28" height="64" rx="14" fill="#2f6ae0"/>
  </g>
</svg>
</body>
</html>
